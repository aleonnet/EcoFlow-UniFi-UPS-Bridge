[project]
name = "river-unifi-bridge"
version = "0.3.2"
description = "EcoFlow RIVER 3 Plus -> NUT -> UniFi bridge daemon (local-first, read-only por padrão)"
requires-python = ">=3.13"
license = { text = "MIT" }
# aiohttp: servidor da API local da UI (§7A.3) — única dependência de runtime.
dependencies = ["aiohttp>=3.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "spawn_ok: the test may run one local process (ssh -G) that never connects; module seams stay blocked",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
