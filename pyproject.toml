[project]
name = "river-unifi-bridge"
version = "0.1.0"
description = "EcoFlow RIVER 3 Plus -> NUT -> UniFi bridge daemon (local-first, read-only por padrão)"
requires-python = ">=3.13"
license = { text = "MIT" }
# Runtime dependencies: stdlib only na Fase 2.
# aiohttp entra na UI-0 (§7A.3) — declarar aqui quando api.py nascer.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
